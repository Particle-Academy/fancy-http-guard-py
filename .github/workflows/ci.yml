name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The TAG this suite pins (PINNED_SUITE_VERSION in
      # tests/test_conformance.py), never `main`. Moving it is a deliberate commit
      # here; test_ci_ref_is_the_pin fails if the two disagree. fancy-conformance
      # is internal tooling and never on PyPI: the loader is read from the
      # checkout, through PYTHONPATH.
      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.48.0
          path: .fancy-conformance
          persist-credentials: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -ra
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          PYTHONPATH: ${{ github.workspace }}/.fancy-conformance/python/src

      # A check never observed to fail is indistinguishable from one that
      # cannot, so the mutation sweep is part of CI: it weakens one guard at a
      # time and fails if the suite does not notice. It restores each file in a
      # `finally`, and runs last.
      - name: Sabotage sweep
        run: python tests/sabotage.py
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          PYTHONPATH: ${{ github.workspace }}/.fancy-conformance/python/src

  # Proves the zero-dependency claim rather than asserting it: the package and
  # the whole conformance suite run with nothing but pytest and first-party
  # fancy-holy-sheet (itself dependency-free) installed. Starlette and FastAPI
  # absent is the raw-ASGI branch; the main job covers the framework branch.
  no-dependencies:
    runs-on: ubuntu-latest
    name: Zero runtime dependencies
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.48.0
          path: .fancy-conformance
          persist-credentials: false

      - name: Install with NO extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest fancy-holy-sheet

      - name: Nothing but pytest, holy-sheet and this package
        run: |
          echo "--- installed ---"
          python -m pip list --format=freeze
          python - <<'PY'
          import importlib.metadata as md
          allowed = {"fancy-http-guard", "fancy-holy-sheet", "pytest", "pip", "setuptools", "wheel",
                     "iniconfig", "packaging", "pluggy", "exceptiongroup", "tomli",
                     "colorama", "pygments"}
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          extra = installed - allowed
          assert not extra, f"unexpected packages pulled in: {sorted(extra)}"
          print("clean:", sorted(installed))
          PY

      - name: Import and run the suite without starlette or fastapi
        run: |
          python -c "import starlette" && exit 1 || echo "starlette absent, as expected"
          python -c "import fastapi" && exit 1 || echo "fastapi absent, as expected"
          python -c "import fancy_http_guard; print(fancy_http_guard.__version__)"
          pytest -ra
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          PYTHONPATH: ${{ github.workspace }}/.fancy-conformance/python/src
